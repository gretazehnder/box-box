[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1analysis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.4",
    "pandas",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
dev = ["jupyter", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]